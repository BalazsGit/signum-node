# Browser module UI strings — single source of truth (plan D16).
# Key format: browser.<context>.<key>.
# Missing keys are returned as-is at runtime (see application.utils.i18n.I18n),
# so forgotten entries are visible during development.

browser.module.name=Browser

# Engine lifecycle screens (A8: preparing / failed / idle)
browser.engine.preparing=Preparing browser engine...
browser.engine.preparing.hint=The first start can take a few seconds.
browser.engine.idle=The browser engine is not running.
browser.engine.failed.title=Browser engine failed to start
browser.engine.failed.reason=Reason: {0}
browser.engine.failed.hint=Check that the JCEF distribution is extracted (gradlew extractJcef) and see the application log for details.

# Tab strip (T1, T2, T5, T6)
browser.tab.new=New tab
browser.tab.new.tooltip=New tab (Ctrl+T)
browser.tab.close.tooltip=Close tab (Ctrl+W)
browser.tab.title.newtab=New Tab
browser.tab.scroll.left=Scroll tabs left
browser.tab.scroll.right=Scroll tabs right
