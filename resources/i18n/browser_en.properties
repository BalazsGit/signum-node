# Browser module UI strings — single source of truth (plan D16).
# Key format: browser.<context>.<key>.
# Missing keys are returned as-is at runtime (see application.utils.i18n.I18n),
# so forgotten entries are visible during development.

browser.module.name=Browser

# Engine lifecycle screens (A8: preparing / failed / idle)
browser.engine.preparing=Preparing browser engine...
browser.engine.preparing.hint=The first start can take a few seconds.
browser.engine.idle=The browser engine is not running.
browser.engine.failed.title=Browser engine failed to start
browser.engine.failed.reason=Reason: {0}
browser.engine.failed.hint=Check that the JCEF distribution is extracted (gradlew extractJcef) and see the application log for details.

# Tab strip (T1, T2, T5, T6)
browser.tab.new=New tab
browser.tab.new.tooltip=New tab (Ctrl+T)
browser.tab.close.tooltip=Close tab (Ctrl+W)
browser.tab.title.newtab=New Tab
browser.tab.scroll.left=Scroll tabs left
browser.tab.scroll.right=Scroll tabs right

# Navigation toolbar (F2: N3, N5, N9)
browser.nav.back.tooltip=Back (Alt+Left)
browser.nav.forward.tooltip=Forward (Alt+Right)
browser.nav.reload.tooltip=Reload (F5)
browser.nav.stop.tooltip=Stop (Esc)
browser.nav.home.tooltip=Home
browser.nav.title.tooltip=Page title

# Omnibox (F2: N1, N2)
browser.omnibox.placeholder=Search or enter URL
browser.omnibox.suggestion.visit=Open {0}
browser.omnibox.suggestion.search=Search for "{0}"

# Security icon (F2: S1, S4)
browser.security.secure.tooltip=Connection to {0} is secure
browser.security.insecure.tooltip=Connection to {0} is not secure
browser.security.certError.tooltip=The certificate of {0} failed validation
browser.security.internal.tooltip=Internal Signum page
browser.security.click.tooltip=View certificate details

# Certificate details dialog (F2: S2)
browser.cert.dialog.title=Certificate: {0}
browser.cert.dialog.loading=Checking certificate...
browser.cert.dialog.failed=Could not verify the certificate: {0}
browser.cert.dialog.close=Close
browser.cert.field.subject=Subject
browser.cert.field.issuer=Issuer
browser.cert.field.valid=Valid
browser.cert.field.san=SAN (host names)
browser.cert.field.algorithm=Signature algorithm
