######################################################################
# Signum Node - user-editable L1 layer (logging)
#
# Every ACTIVE (uncommented) line below overrides the hardcoded L0
# logging default for EVERY logging profile (including the shared
# "logging" profile). A per-profile file (L2:
# conf/node/logging/{profile}.properties, plus the shared
# conf/node/logging/logging.properties) overrides these values per key.
#
# This file is USER-OWNED (F7): it is auto-created at first start
# (you see its empty initial state here), it is NEVER overwritten by
# the classpath sync, and you may delete it any time to restore the
# pure L0 defaults (it is re-created on the next start).
#
# Layer order (per key, the highest wins):
#   L0: hardcoded logging defaults (NodeLoggingProfile / LoggerProfile)
#   L1: THIS FILE
#   L2: conf/node/logging/{profile}.properties
#
# The fully commented logging-default.properties file documents every
# available L0 key and value - consult it as the complete reference.
#
# Encoding: UTF-8
######################################################################
#
# Examples (uncomment and adjust to activate):
# node.level=FINE
# .level=INFO