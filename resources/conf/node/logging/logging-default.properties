######################################################################
# Signum Node - reference template for the L0 logging defaults
#
# This file is a READ-ONLY reference: it is (re)synchronized from the
# classpath resources on startup (SHA-256 comparison), so any change
# made to it will be LOST. It is NOT read at runtime.
#
# Three-layer logging configuration model (per key, the highest wins):
#   L0: Hardcoded defaults (NodeLoggingProfile / LoggerProfile) - every
#       line below documents one of them.
#   L1: conf/node/logging/default.properties - user-editable; its ACTIVE
#       (uncommented) lines override L0 for EVERY logging profile,
#       including the shared "logging" profile. Auto-created at first
#       start, never overwritten by the sync, safe to delete.
#   L2: conf/node/logging/{profile}.properties (GUI-editable profiles) and the
#       shared conf/node/logging/logging.properties.
#
# Encoding: UTF-8
######################################################################

#### GLOBAL LOGGING SETTINGS ####
###############################

## Root logger level - everything not covered by a more specific key.
# .level = SEVERE
## Comma-separated list of JUL handlers attached to the root logger.
# handlers = java.util.logging.ConsoleHandler
## Log level of the application.module.node package (the "node." shorthand is
## remapped to application.module.node.* at startup).
# node.level = INFO
## The console handler level (ALL = every record reaching it is printed).
# java.util.logging.ConsoleHandler.level = ALL
## The console line formatter.
# java.util.logging.ConsoleHandler.formatter = application.module.node.util.BriefLogFormatter
## GUI console buffer size (lines).
# node.gui.consoleLogSize = 100000

#### LIBRARY NOISE SUPPRESSION ####
###################################
# org.eclipse.jetty.level = OFF
# javax.servlet.level = OFF
# com.zaxxer.hikari.level = WARNING
# com.zaxxer.hikari.HikariConfig.level = INFO
# sun.rmi.level = INFO
# javax.management.level = INFO
# node.db.store.DerivedTableManager.level = OFF
# org.jooq.Constants.level = OFF

#### FILE LOGGING RECIPE (JUL FileHandler) ####
###############################################
## Optional global file logging, handled by the JUL FileHandler (one file
## for the whole JVM, shared by every node profile - for per-NODE file
## logging use the node.fileLog.* keys in node-default.properties instead).
## To enable: set the "handlers" line above to
##   handlers = java.util.logging.FileHandler, java.util.logging.ConsoleHandler
## and uncomment this block.
# java.util.logging.FileHandler.level = FINE
# java.util.logging.FileHandler.pattern = node.log
# java.util.logging.FileHandler.limit = 5000000
# java.util.logging.FileHandler.count = 1