#######################################################################
# Signum Node - user-editable L1 layer (node profiles)                #
#                                                                     #
# Every ACTIVE (uncommented) line below overrides the hardcoded L0    #
# default for EVERY node profile. A per-profile file (L2:             #
# conf/node/profiles/{profile}.properties) overrides these values     #
# per key.                                                            #
#                                                                     #
# This file is USER-OWNED (F7): it is auto-created at first start     #
# (you see its empty initial state here), it is NEVER overwritten by  #
# the classpath sync, and you may delete it any time to restore the   #
# pure L0 defaults (it is re-created on the next start).              #
#                                                                     #
# Layer order (per key, the highest wins):                            #
#   L0: hardcoded defaults (Props.java)                               #
#   L1: THIS FILE                                                     #
#   L2: conf/node/profiles/{profile}.properties                       #
#                                                                     #
# The fully commented node-default.properties file documents every    #
# available L0 key and value - consult it as the complete reference.  #
#                                                                     #
# Encoding: UTF-8                                                     #
#######################################################################
#
# Examples (uncomment and adjust to activate):
# API.Port=8125
# P2P.Port=8123
# node.network=signum.net.TestnetNetwork