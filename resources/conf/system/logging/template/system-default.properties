######################################################################
# Node System - reference template for the SYSTEM-LEVEL (JVM-global)
# L0 logging defaults
#
# This file is a READ-ONLY reference: it is (re)synchronized from the
# classpath resources on startup (SHA-256 comparison), so any change
# made to it will be LOST. It is NOT read at runtime.
#
# System-level (global) logging configuration model (per key, the
# highest wins):
#   L0: Hardcoded system defaults (the L0 of every non-node module
#       provider, e.g. database/browser; every line below documents the
#       scope and the key names they support).
#   L1: conf/system/logging/default.properties - user-editable; its
#       ACTIVE (uncommented) lines override L0 for the GLOBAL logging
#       context. Auto-created at first start, never overwritten by the
#       sync, safe to delete. (The node module's L1,
#       conf/node/logging/default.properties, still contributes
#       global-scope keys for backward compatibility - the system L1
#       has priority over it.)
#
# Scope note: a <class>.level key belongs to the GLOBAL context when the
# class is NOT part of the node engine (application.module.node.** except
# node.gui./node.profile./node.logging.); engine classes are configured
# through the NODE logging layer instead. Per-NODE file logging
# (node.fileLog.*) is a NODE-scope key - not configured here.
#
# Encoding: UTF-8
######################################################################

#### GLOBAL ROOT ####
########################
## Root logger level of the GLOBAL (system) context - everything not
## covered by a more specific global key.
# level = INFO

#### GLOBAL CLASS OVERRIDES ####
#################################
## Log level of an arbitrary non-node-engine class (package-based
## ownership decides the global context). The L0 defaults of the module
## providers are:
# org.eclipse.jetty.level = OFF
# javax.servlet.level = OFF
# com.zaxxer.hikari.level = WARN
# com.zaxxer.hikari.HikariConfig.level = INFO
# sun.rmi.level = INFO
# javax.management.level = INFO
# org.jooq.Constants.level = OFF

#### GUI ####
###############
## GUI console buffer size (lines) - a global (GUI-bus) setting.
# node.gui.consoleLogSize = 100000

#### LOG FILE LAYOUT (informational) ####
###########################################
## Node file logs are written OUTSIDE the configuration tree, relative
## to the application root: logs/node/{profile}.log (rotated as
## {profile}-%i.log.gz; size/count keys node.fileLog.size /
## node.fileLog.max are NODE-scope, see the node logging layer).
## System-level (global) file logs use: logs/system/