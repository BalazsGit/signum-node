######################################################################
# Signum System - user-editable L1 layer (system-level logging)
#
# Every ACTIVE (uncommented) line below overrides the hardcoded L0
# system-level (JVM-global) logging default for the GLOBAL logging
# context. A per-key priority chain applies (highest wins):
#   L0: hardcoded system defaults (module providers: database, browser, ...)
#   L1: THIS FILE
#   (the node module's L1, conf/node/logging/default.properties, still
#    contributes global-scope keys for backward compatibility — THIS
#    file has priority over it)
#
# This file is USER-OWNED: it is auto-created at first start (you see
# its empty initial state here), it is NEVER overwritten by the
# classpath sync, and you may delete it any time to restore the pure
# L0 defaults (it is re-created on the next start).
#
# The fully commented system-default.properties file documents every
# available system-level key and value - consult it as the complete
# reference.
#
# Encoding: UTF-8
######################################################################
#
# Examples (uncomment and adjust to activate):
# level=INFO
# org.eclipse.jetty.level=INFO