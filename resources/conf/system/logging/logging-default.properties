############################################################
#        Signum System-Level Logging Configuration         #
#                                                          #
# This is the absolute fallback for ALL modules.           #
# Only application/system, kernel, and GUI packages.       #
#                                                          #
# Location: resources/conf/system/logging/                 #
# Loaded from: classpath:/conf/system/logging/             #
############################################################

# Use console handler (file logging handled separately)
handlers=java.util.logging.ConsoleHandler

# Root level
.level=INFO

# System/kernel packages
.level.application.system=INFO
.level.application.kernel=INFO
.level.application.gui=INFO

# Console handler
java.util.logging.ConsoleHandler.level=ALL
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter

# Third-party noise reduction
com.zaxxer.hikari.pool.PoolBase.level=SEVERE
sun.net.www.protocol.http.HttpURLConnection.level=SEVERE
sun.rmi.level=INFO
javax.management.level=INFO
org.eclipse.jetty.level=OFF
javax.servlet.level=OFF