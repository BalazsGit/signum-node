<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="css/browser.css">
  <style>
    /* F3 (H2/H3): the browsing history page. The page is a pure template:
       every UI string and every entry arrives in the JSON data island
       (browser.history.* i18n keys + HistoryStore rows), rendered
       exclusively through textContent (S9: no innerHTML with dynamic data).
       Day grouping (H2), search + time filter (H2) and deletion (H3) are
       plain navigations back to signum://history with query parameters. */
    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    .bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 26px 12px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
      color: var(--fg);
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
    }
    #search-form {
      display: flex;
      align-items: center;
    }
    #search-form input {
      width: 220px;
      padding: 8px 14px;
      font-size: 13px;
      color: var(--fg);
      background: var(--card);
      border: 1px solid var(--border);
      border-right: 0;
      border-radius: 18px 0 0 18px;
      outline: none;
      transition: border-color 120ms ease;
    }
    #search-form input::placeholder {
      color: var(--muted);
    }
    #search-form input:focus {
      border-color: var(--accent);
    }
    #search-form select {
      padding: 8px 6px;
      font-size: 13px;
      color: var(--fg);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0;
      outline: none;
    }
    #search-form button {
      width: 40px;
      border: 1px solid var(--border);
      border-left: 0;
      border-radius: 0 18px 18px 0;
      background: var(--card);
      color: var(--accent);
      font-size: 15px;
      cursor: pointer;
      transition: filter 120ms ease;
    }
    #search-form button:hover {
      filter: brightness(1.25);
    }
    #clear {
      padding: 8px 16px;
      font-size: 13px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--danger);
      cursor: pointer;
      transition: border-color 120ms ease, background 120ms ease;
    }
    #clear:hover {
      border-color: var(--danger);
      background: rgba(229, 72, 77, 0.08);
    }
    #list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 26px 26px;
    }
    .empty {
      margin-top: 40px;
      font-size: 14px;
      color: var(--muted);
    }
    .day {
      margin: 18px 0 6px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 7px 10px;
      border-radius: 8px;
      transition: background 100ms ease;
    }
    .row:hover {
      background: var(--card);
    }
    .row__link {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
      text-decoration: none;
    }
    .row__title {
      font-size: 14px;
      color: var(--fg);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .row__url {
      font-size: 12px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .row__time {
      font-size: 12px;
      color: var(--muted);
      min-width: 44px;
      text-align: right;
    }
    .row__visits {
      font-size: 11px;
      color: var(--muted);
      min-width: 52px;
      text-align: right;
    }
    .row__delete {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transition: opacity 120ms ease, border-color 120ms ease, color 120ms ease;
    }
    .row:hover .row__delete {
      opacity: 1;
    }
    .row__delete:hover {
      border-color: var(--danger);
      color: var(--danger);
    }
  </style>
</head>
<body>
  <header class="bar">
    <h1 id="title"></h1>
    <div class="controls">
      <form id="search-form" role="search">
        <input id="search" type="text" autocomplete="off">
        <select id="range">
          <option value="all"></option>
          <option value="today"></option>
          <option value="7d"></option>
          <option value="30d"></option>
        </select>
        <button type="submit" aria-label="search">&#8629;</button>
      </form>
      <button id="clear" type="button"></button>
    </div>
  </header>
  <main id="list"></main>
  <script id="signum-data" type="application/json">__SIGNUM_DATA__</script>
  <script>
    (function () {
      var data = JSON.parse(document.getElementById('signum-data').textContent);
      var s = data.strings;

      document.title = s.title;
      document.getElementById('title').textContent = s.title;

      // Search + time filter (H2): a filter change navigates to the same
      // page with query parameters; the Java renderer re-queries the store.
      var search = document.getElementById('search');
      search.value = data.q || '';
      search.placeholder = s.searchPlaceholder;
      var range = document.getElementById('range');
      var rangeLabels = { all: s.rangeAll, today: s.rangeToday, '7d': s.range7d, '30d': s.range30d };
      Array.prototype.forEach.call(range.options, function (opt) {
        opt.textContent = rangeLabels[opt.value] || opt.value;
      });
      range.value = rangeLabels[data.range] ? data.range : 'all';
      function querySuffix(q, r) {
        var parts = [];
        if (q) { parts.push('q=' + encodeURIComponent(q)); }
        if (r && r !== 'all') { parts.push('range=' + encodeURIComponent(r)); }
        return parts.length ? '?' + parts.join('&') : '';
      }
      function navigate() {
        window.location.href = 'signum://history' + querySuffix(search.value.trim(), range.value);
      }
      document.getElementById('search-form').addEventListener('submit', function (e) {
        e.preventDefault();
        navigate();
      });
      range.addEventListener('change', navigate);

      // Clear everything (H3): the confirmation is the browser dialog.
      var clearBtn = document.getElementById('clear');
      clearBtn.textContent = s.clear;
      clearBtn.addEventListener('click', function () {
        if (confirm(s.clearConfirm)) {
          window.location.href = 'signum://history/clear';
        }
      });

      // Day grouping (H2): entries arrive newest-first, so first-seen order
      // is the correct group order.
      var list = document.getElementById('list');
      var entries = data.entries || [];
      if (!entries.length) {
        var empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = s.empty;
        list.appendChild(empty);
        return;
      }
      var now = new Date(data.now);
      var todayKey = now.toDateString();
      var yesterdayKey = new Date(data.now - 86400000).toDateString();
      var groups = [];
      var byKey = {};
      entries.forEach(function (entry) {
        var d = new Date(entry.ts);
        var key = d.toDateString();
        var label;
        if (key === todayKey) {
          label = s.today;
        } else if (key === yesterdayKey) {
          label = s.yesterday;
        } else {
          label = d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
        }
        var group = byKey[key];
        if (!group) {
          group = byKey[key] = { label: label, items: [] };
          groups.push(group);
        }
        group.items.push(entry);
      });
      groups.forEach(function (group) {
        var header = document.createElement('h2');
        header.className = 'day';
        header.textContent = group.label;
        list.appendChild(header);
        group.items.forEach(function (entry) {
          var row = document.createElement('div');
          row.className = 'row';
          var link = document.createElement('a');
          link.className = 'row__link';
          link.href = entry.url;
          var title = document.createElement('span');
          title.className = 'row__title';
          title.textContent = entry.title || entry.url;
          var urlEl = document.createElement('span');
          urlEl.className = 'row__url';
          urlEl.textContent = entry.url;
          link.appendChild(title);
          link.appendChild(urlEl);
          var time = document.createElement('span');
          time.className = 'row__time';
          time.textContent = new Date(entry.ts).toLocaleTimeString(
              undefined, { hour: '2-digit', minute: '2-digit' });
          var del = document.createElement('button');
          del.type = 'button';
          del.className = 'row__delete';
          del.textContent = '\u00D7';
          del.title = s.delete;
          // Single-entry deletion (H3): the renderer executes the delete and
          // re-renders the listing with the same filters.
          del.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            window.location.href = 'signum://history/delete?id=' + entry.id +
                querySuffix(data.q || '', data.range || 'all');
          });
          row.appendChild(link);
          row.appendChild(time);
          if (entry.visits > 1) {
            var visits = document.createElement('span');
            visits.className = 'row__visits';
            visits.textContent = s.visits.replace('{0}', String(entry.visits));
            row.appendChild(visits);
          }
          row.appendChild(del);
          list.appendChild(row);
        });
      });
    })();
  </script>
</body>
</html>
