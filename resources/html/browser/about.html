<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="css/browser.css">
  <style>
    /* F6 (C9): the about page — app, pinned JCEF release, running CEF
       runtime, JVM, OS and the D17 engine-hardening state. Same design
       language as the settings/bookmarks pages (wrap + section cards).
       Pure template (D16): every string arrives in the JSON data island,
       rendered through textContent only (S9). The layout is plain document
       flow (no negative offsets / viewport centering) so the brand can
       never be clipped at the top of the page. */
    body {
      background: var(--bg);
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 30px 30px 44px;
    }
    .head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    /* The wordmark: explicit line-height so the light-weight glyphs are
       never clipped at the top (the previous flex-centered card cut the
       ascenders off when the card overflowed the viewport). */
    .brand {
      margin: 0;
      font-size: 30px;
      font-weight: 300;
      letter-spacing: 5px;
      line-height: 1.3;
      color: var(--fg);
    }
    .back {
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      transition: color 120ms ease;
    }
    .back:hover {
      color: var(--accent);
    }
    .section {
      margin-top: 18px;
      padding: 18px 20px 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .section h2 {
      margin: 0 0 12px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .row:last-child {
      border-bottom: 0;
    }
    .row .k {
      width: 42%;
      flex-shrink: 0;
      color: var(--muted);
      white-space: nowrap;
    }
    .row .v {
      color: var(--fg);
      word-break: break-word;
    }
    /* D17 hardening state as a quiet status chip. */
    .chip {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid var(--border);
      color: var(--fg);
    }
    .chip.on {
      color: var(--accent);
      border-color: rgba(79, 140, 255, 0.4);
      background: rgba(79, 140, 255, 0.08);
    }
    .chip.off {
      color: var(--danger);
      border-color: rgba(229, 72, 77, 0.4);
      background: rgba(229, 72, 77, 0.08);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="head">
      <h1 class="brand" id="brand"></h1>
      <a class="back" href="signum://settings" id="back"></a>
    </header>
    <div class="section">
      <h2 id="h2-engine"></h2>
      <div class="row"><span class="k" id="k-jcef"></span><span class="v" id="v-jcef"></span></div>
      <div class="row"><span class="k" id="k-cef"></span><span class="v" id="v-cef"></span></div>
      <div class="row"><span class="k" id="k-gpu"></span><span class="v" id="v-gpu"></span></div>
      <div class="row"><span class="k" id="k-sandbox"></span><span class="v" id="v-sandbox"></span></div>
    </div>
    <div class="section">
      <h2 id="h2-runtime"></h2>
      <div class="row"><span class="k" id="k-java"></span><span class="v" id="v-java"></span></div>
      <div class="row"><span class="k" id="k-os"></span><span class="v" id="v-os"></span></div>
    </div>
  </div>
  <script id="data" type="application/json">__SIGNUM_DATA__</script>
  <script>
    (function () {
      var data = JSON.parse(document.getElementById('data').textContent);
      var s = data.strings || {};
      document.title = s.title || '';
      function text(id, value) {
        var el = document.getElementById(id);
        if (el) {
          el.textContent = value || '';
        }
      }
      text('brand', data.appName || s.app);
      text('back', s.back);
      text('h2-engine', s.engineSection);
      text('h2-runtime', s.runtimeSection);
      text('k-jcef', s.jcef);
      text('v-jcef', data.jcefVersion || '-');
      text('k-cef', s.cef);
      text('v-cef', data.cefVersion || s.cefNotStarted);
      text('k-java', s.java);
      text('v-java', data.javaVersion || '-');
      text('k-os', s.os);
      text('v-os', data.os || '-');
      // GPU / sandbox as status chips (on = accent, off = danger).
      function chip(id, onLabel, offLabel, on) {
        var el = document.getElementById(id);
        if (!el) {
          return;
        }
        var chipEl = document.createElement('span');
        chipEl.className = 'chip ' + (on ? 'on' : 'off');
        chipEl.textContent = on ? s[onLabel] : s[offLabel];
        el.replaceWith(chipEl);
      }
      text('k-gpu', s.gpu);
      text('k-sandbox', s.sandbox);
      chip('v-gpu', 'gpuEnabled', 'gpuDisabled', data.gpu === 'enabled');
      chip('v-sandbox', 'sandboxEnabled', 'sandboxDisabled', data.sandbox === 'enabled');
    })();
  </script>
</body>
</html>
