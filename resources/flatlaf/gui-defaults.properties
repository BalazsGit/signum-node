# Signum Node - Application-wide GUI Defaults
# These properties are loaded by FlatLaf's custom defaults source mechanism.
# They provide baseline values that can be overridden by gui-settings.json at runtime.
# Changes here require a restart. Runtime changes should go through GuiManager API.

# Tab layout policy: 0 = SCROLL_TAB_LAYOUT, 1 = WRAP_TAB_LAYOUT
# Default is SCROLL for better tab visibility with many tabs
TabbedPane.tabLayoutPolicy=0