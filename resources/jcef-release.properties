# Generated at build time by Gradle (processResources `filesMatching` expansion).
# Do NOT edit the values by hand: the single source of truth is gradle.properties
# (jcef.version + jcef.sha256.*). The runtime JCEF auto-installer
# (application.module.browser.core.JcefProvisioner) reads this file to know which
# Maven Central artifact to download and which SHA-256 pin to verify against.
jcef.version=${jcefVersion}
jcef.sha256.windows-amd64=${jcefSha256WindowsAmd64}
jcef.sha256.windows-arm64=${jcefSha256WindowsArm64}
jcef.sha256.linux-amd64=${jcefSha256LinuxAmd64}
jcef.sha256.linux-arm64=${jcefSha256LinuxArm64}
jcef.sha256.macosx-amd64=${jcefSha256MacosxAmd64}
jcef.sha256.macosx-arm64=${jcefSha256MacosxArm64}
