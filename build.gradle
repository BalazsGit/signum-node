test {
    useJUnitPlatform()
    testLogging {
        exceptionFormat = 'full'
        showStandardStreams = true
        events = ["passed", "skipped", "failed"]
    }

    jvmArgs += [
        "--add-opens=java.base/java.lang=ALL-UNNAMED",
        "--add-opens=java.base/java.util=ALL-UNNAMED",
        "--add-opens=java.base/java.io=ALL-UNNAMED",
        "--add-opens=java.base/java.net=ALL-UNNAMED",
        "--add-opens=java.base/jdk.internal.reflect=ALL-UNNAMED",
        "--add-opens=java.logging/java.util.logging=ALL-UNNAMED"
    ]

    exclude '**/FeeSuggestionCalculatorTest.class',
            '**/AliasServiceImplTest.class',
            '**/it/java/node/**',
            '**/chain/**'
}

/**
 * Exclude-free test runner: lets {@code --tests '<FQCN>'} work against the full test tree.
 * The default {@code test} task excludes several classes (see above), which makes Gradle
 * report "No tests found for given includes … (exclude rules)" when combined with {@code --tests}.
 * Use this task to run a specific test class without those exclusions:
 *
 * <pre>{@code
 * gradlew runTest --tests 'application.module.logging.gui.LoggingPanelTest'
 * }</pre>
 */
tasks.register('runTest', Test) {
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    testLogging {
        exceptionFormat = 'full'
        showStandardStreams = true
        events = ["passed", "skipped", "failed"]
    }
    jvmArgs += [
        "--add-opens=java.base/java.lang=ALL-UNNAMED",
        "--add-opens=java.base/java.util=ALL-UNNAMED",
        "--add-opens=java.base/java.io=ALL-UNNAMED",
        "--add-opens=java.base/java.net=ALL-UNNAMED",
        "--add-opens=java.base/jdk.internal.reflect=ALL-UNNAMED",
        "--add-opens=java.logging/java.util.logging=ALL-UNNAMED"
    ]
}

/**
 * Integration tests requiring a LIVE mock node on localhost:6876 (see chain.ChainUtils.setupNode).
 * Skipped automatically when no node is reachable; run explicitly with: gradlew integrationTest
 */
import java.net.Socket

tasks.register('integrationTest', Test) {
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/chain/**'
    testLogging {
        exceptionFormat = 'full'
        showStandardStreams = true
        events = ["passed", "skipped", "failed"]
    }
    jvmArgs += [
        "--add-opens=java.base/java.lang=ALL-UNNAMED",
        "--add-opens=java.base/java.util=ALL-UNNAMED",
        "--add-opens=java.base/java.io=ALL-UNNAMED",
        "--add-opens=java.base/java.net=ALL-UNNAMED",
        "--add-opens=java.base/jdk.internal.reflect=ALL-UNNAMED",
        "--add-opens=java.logging/java.util.logging=ALL-UNNAMED"
    ]
    onlyIf {
        try {
            new Socket("localhost", 6876).withCloseable { it.isConnected() }
        } catch (Exception e) {
            logger.warn("integrationTest skipped: no mock node reachable on localhost:6876")
            return false
        }
        return true
    }
}

application {
    mainClass.set('application.launcher.Launcher')
}

sourceSets {
    main {
        java.srcDir "src"
        resources.srcDir "resources"
    }
    if (!project.hasProperty('skipTests')) {
        test {
            java.srcDirs = ["test/java"]
            resources.srcDirs = ["test/resources"]
        }
    }
}

jar {
    manifest {
        attributes 'Multi-Release': 'true'
    }
}

shadowJar {
    mergeServiceFiles()
    // Shadow 9 defaults to DuplicatesStrategy.EXCLUDE, which drops same-path files
    // (e.g. META-INF/services/java.sql.Driver shipped by the postgres/mariadb/sqlite
    // driver jars) BEFORE ServiceFileTransformer merges them - leaving a single JDBC
    // driver registered and breaking DriverManager lookup in the fat jar.
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    archiveFileName = "${baseNodeFileName}-all.jar"
}

tasks.register('buildOpenApi', NpmTask) {
    dependsOn npmInstall
    args = ['run', 'dist']
}

node {
    download = true
    version = '24.21.0'
    nodeProjectDir = file("${project.projectDir}/openapi")
    npmInstallCommand = "ci"
}

// ZIP entry build-time stamp. Java encodes the DOS zip time in UTC, but readers
// (Explorer, 7-Zip) interpret it as the local time of the viewing machine - so add
// the local zone offset (DST included) to make the entries show the local build time.
def archiveBuildTimestamp = providers.provider {
    def now = System.currentTimeMillis()
    now + java.util.TimeZone.getDefault().getOffset(now)
}

tasks.register('dist', Zip) {
    from(project.tasks.shadowJar.outputs.files) {
        include "${baseNodeFileName}-all.jar"
        rename { "${baseNodeFileName}.jar" }
    }

    doFirst {
        // Ensure an empty file exists to be copied as node.properties and logging.properties
        def emptyFile = file("$buildDir/empty.properties")
        emptyFile.parentFile.mkdirs()
        emptyFile.write('')
    }

    from(file("$buildDir/empty.properties")) { into "conf/node"; rename { "node.properties" } }
    from(file("$buildDir/empty.properties")) { into "conf/node/logging"; rename { "logging.properties" } }
    from("resources/conf/node/profiles") { into "conf/node/profiles" } // Copy default node profile from resources
    from("resources/conf/node/logging") { into "conf/node/logging" } // Copy default node logging config from resources
    into('html') { from "html" }
    from "LICENSE.txt"
    from "README.md"
    from("src") { into "src" }
    archiveFileName = "${baseNodeFileName}.zip"
    // Gradle 9 normalizes archive entry timestamps to a fixed 1980 epoch (reproducible
    // archives by default). Stamp them with the local build time instead, so the zip
    // entries show when the distribution was actually built.
    reproducibleFileTimestamp = archiveBuildTimestamp
}

def appName = "SignumNode"

tasks.register('jpackageWin', Exec) {
    group = 'distribution'
    description = 'Builds a Windows EXE using jpackage'
    dependsOn shadowJar, 'unzipWindowsJDK'

    def rawVersion = details.lastTag ?: "1.0.0"
    def version = rawVersion.replaceAll("[^0-9.]", "")
    if (!version.contains(".")) version = "${version}.0"
    def parts = version.tokenize('.').collect { it as int }
    while (parts.size() < 2) parts << 0
    while (parts.size() > 4) parts = parts[0..3]
    if (parts[0] > 255) parts[0] = 1
    version = parts.join('.')

    project.ext.jpackageVersion = version

    def outputDir = "$buildDir/jpackage"
    def exePath = file("$outputDir/${appName}.exe")

    inputs.file("$buildDir/libs/${baseNodeFileName}-all.jar")
    outputs.dir(outputDir)

    doFirst {
        println "==> Running jpackage with:"
        println "  outputDir: ${outputDir}"
        println "  version:   ${version}"
        // jpackage fails if the app-image directory is left over from a previous build;
        // the task re-runs whenever the shadow jar changes, so always start from a clean dir.
        delete(outputDir)
        mkdir(outputDir)
    }

    commandLine = [
        "${System.getenv('JAVA_HOME')}/bin/jpackage",
        '--type', 'app-image',
        // Bundle exactly the same Zulu 25 JRE that is shipped in the zip's
        // 'jre/' folder, so the app-image runtime and the standalone JRE are
        // always consistent (independent of the local JAVA_HOME).
        '--runtime-image', "$buildDir/distributions/jre",
        '--input', "$buildDir/libs",
        '--dest', outputDir,
        '--name', appName,
        '--main-jar', "${baseNodeFileName}-all.jar",
        '--main-class', application.mainClass.get(),
        '--app-version', version,
        '--icon', "${projectDir}/resources/images/signum_overlay_logo.ico"
    ]

        //def exeName = "${appName}-${version}.exe"
        //def exePath2 = file("$outputDir/${exeName}")

        doLast {
            println "==> jpackage output listing:"
            fileTree(dir: outputDir, include: "**/*.exe").files.each {
                println "  - ${it}"
            }
        }
}

import de.undercouch.gradle.tasks.download.Download

// Replacement for the org.kordamp.gradle.jdeps plugin (0.20.0 relies on
// JavaPluginConvention, which Gradle 9 removed). Runs jdeps from the JDK 25
// toolchain against the fat jar and writes the JPMS module dependency list
// that the Dockerfile's jlink step consumes.
tasks.register('jdeps') {
    group = 'verification'
    description = 'Prints the JPMS module dependencies of the shadow jar (used by the Dockerfile jlink step)'
    dependsOn shadowJar
    def outFile = layout.buildDirectory.file('reports/jdeps/print-module-deps-main.txt')
    inputs.file(tasks.shadowJar.archiveFile)
    outputs.file(outFile)
    doLast {
        // Use the JDK 25 toolchain's jdeps (NOT the Gradle daemon JVM, which may
        // be any Java 17+), so the module list always matches the Dockerfile's
        // jlink (openjdk25), regardless of the machine running the build.
        def jdk25Home = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(25)
        }.get().metadata.installationPath.asFile
        def jdepsExe = new File(jdk25Home, 'bin' + File.separator + 'jdeps' + (org.gradle.internal.os.OperatingSystem.current().isWindows() ? '.exe' : ''))
        def out = outFile.get().asFile
        out.parentFile.mkdirs()
        // Gradle 9 removed Project.exec(); drive the jdeps launcher directly.
        // Mirrors the former kordamp plugin flags:
        // -Pjdeps.recursive=true, -Pjdeps.ignore.missing.deps=true, -Pjdeps.print.module.deps=true
        def process = new ProcessBuilder(
            jdepsExe.absolutePath,
            '--multi-release', '25',
            '--recursive',
            '--ignore-missing-deps',
            '--print-module-deps',
            tasks.shadowJar.archiveFile.get().asFile.absolutePath
        ).redirectError(ProcessBuilder.Redirect.INHERIT).start()
        out.text = process.inputStream.text.trim()
        def code = process.waitFor()
        if (code != 0) {
            throw new GradleException("jdeps failed with exit code ${code}:\n${out.text.take(2000)}")
        }
    }
}
def jdkVersion = 'zulu25.36.205-ca-jre25.0.4.1'
def jdkZip = "build/distributions/${jdkVersion}-win_x64.zip"
def jdkZipName = "${jdkVersion}-win_x64.zip"


tasks.register('downloadWindowsJDK', de.undercouch.gradle.tasks.download.Download) {
    src "https://cdn.azul.com/zulu/bin/${jdkVersion}-win_x64.zip"
    dest jdkZip
    overwrite true
    doLast {
    def file = file("build/distributions/${jdkZipName}")
    if (!file.exists() || file.length() < 10_000) {
        throw new GradleException("ZIP file seems invalid or too small: ${file}")
        }
    }
}


tasks.register('unzipWindowsJDK', Copy) {
    dependsOn downloadWindowsJDK
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    outputs.dir("build/distributions/jre")
    into "build/distributions/jre"

    def zipRoot = zipTree(jdkZip)
    def rootDirName = "${jdkVersion}-win_x64"

    from(zipRoot.matching {
        eachFile { f ->
            def segments = f.relativePath.segments
            if (segments[0] == rootDirName) {
                f.relativePath = new RelativePath(f.relativePath.isFile(), *segments.drop(1))
            }
        }
        includeEmptyDirs = false
    })

    doFirst {
        def zipFile = file(jdkZip)
        if (!zipFile.exists()) {
            throw new GradleException("Expected JDK zip not found: ${zipFile}")
        }
    }
}

tasks.register('zipWinExe', Zip) {
    dependsOn jpackageWin
    dependsOn unzipWindowsJDK

    def appImageDir = "${project.buildDir}/jpackage/${appName}"

    from(appImageDir) {
        include "**/*"
    }

    doFirst {
        // Ensure an empty file exists to be copied as node.properties and logging.properties
        def emptyFile = file("$buildDir/empty.properties")
        emptyFile.parentFile.mkdirs()
        emptyFile.write('')
    }

    from(file("$buildDir/empty.properties")) { into "conf/node"; rename { "node.properties" } }
    from(file("$buildDir/empty.properties")) { into "conf/node/logging"; rename { "logging.properties" } }
    from("resources/conf/node/profiles") { into "conf/node/profiles" } // Copy default node profile from resources
    from("resources/conf/node/logging") { into "conf/node/logging" } // Copy default node logging config from resources
    into('html') { from "html" }
    from "LICENSE.txt"
    from "README.md"
    from("src") { into "src" }
    into('jre') { from "build/distributions/jre" }

    archiveFileName = "${baseNodeFileName}-win_x64.zip"
    destinationDirectory = file("$buildDir/distributions")
    // Same as `dist`: show the local build time on the archive entries instead of the
    // fixed 1980 reproducible epoch that Gradle 9 uses by default.
    reproducibleFileTimestamp = archiveBuildTimestamp
}

import org.gradle.crypto.checksum.Checksum

tasks.register('release', Checksum) {
    dependsOn test, dist, zipWinExe
    files = files([
        "build/distributions/${baseNodeFileName}.zip",
        "build/distributions/${baseNodeFileName}-win_x64.zip",
    ])
}
