// ── JCEF (browser module) ──────────────────────────────────────────────────────────────
// Pinned JCEF distribution (gradle.properties; provenance: implementation plan Appendix A).
// Two artifacts per platform:
//   jcef-api            : pure Java API (org.cef.*) + transitive JOGL/gluegen (JNA) ->
//                         shadow-safe, ends up in the fat jar like any other dependency
//   jcef-natives-<key>  : the full native CEF distribution (libcef, subprocesses, locales).
//                         NEVER placed on the classpath: the `extractJcef` task unpacks it
//                         into the dedicated, git-ignored jcef/<os>-<arch>/ directory and
//                         the engine runs from there (plan D1/D2). Cross-build with
//                         -Pjcef.os=windows|linux|macosx and -Pjcef.arch=amd64|arm64.
def jcefVersion = project.property('jcef.version')
def jcefOsName = System.getProperty('os.name').toLowerCase()
def jcefOs = project.findProperty('jcef.os') ?:
        (jcefOsName.startsWith('windows') ? 'windows' : jcefOsName.startsWith('mac') ? 'macosx' : 'linux')
def jcefArchName = System.getProperty('os.arch').toLowerCase()
def jcefArch = project.findProperty('jcef.arch') ?:
        (jcefArchName.contains('aarch64') || jcefArchName.contains('arm64') ? 'arm64' : 'amd64')
def jcefKey = "${jcefOs}-${jcefArch}"
def jcefRoot = file('jcef')

// Runtime JCEF auto-install (JcefProvisioner): the version + SHA-256 pins from
// gradle.properties are stamped into a resource so the app can download and
// verify the pinned natives artifact itself (Maven Central). Single source of
// truth stays gradle.properties.
processResources {
    filesMatching('jcef-release.properties') {
        expand(
                jcefVersion: jcefVersion,
                jcefSha256WindowsAmd64: (project.findProperty('jcef.sha256.windows-amd64') ?: ''),
                jcefSha256WindowsArm64: (project.findProperty('jcef.sha256.windows-arm64') ?: ''),
                jcefSha256LinuxAmd64: (project.findProperty('jcef.sha256.linux-amd64') ?: ''),
                jcefSha256LinuxArm64: (project.findProperty('jcef.sha256.linux-arm64') ?: ''),
                jcefSha256MacosxAmd64: (project.findProperty('jcef.sha256.macosx-amd64') ?: ''),
                jcefSha256MacosxArm64: (project.findProperty('jcef.sha256.macosx-arm64') ?: '')
        )
    }
}

configurations {
    // Build-only configuration: consumed by extractJcef, must not leak onto the app classpath.
    jcefNatives
}

dependencies {
    implementation "me.friwi:jcef-api:${jcefVersion}"
    jcefNatives "me.friwi:jcef-natives-${jcefKey}:${jcefVersion}"
}

/**
 * Compares the SHA-256 of a resolved JCEF artifact against its pin in gradle.properties.
 * The API pin is always enforced; a missing natives pin for the current platform warns
 * (add the reported hash after first verification on that platform).
 */
def sha256Of = { File f ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    f.newInputStream().withCloseable { input ->
        def buffer = new byte[8192]
        int n
        while ((n = input.read(buffer)) > 0) {
            digest.update(buffer, 0, n)
        }
    }
    digest.digest().collect { String.format('%02x', it) }.join()
}

def verifyJcefArtifact = { String label, String pinKey, File file ->
    def actual = sha256Of(file)
    def pin = (providers.gradleProperty(pinKey).orNull ?: '').trim()
    if (pin.isEmpty()) {
        if (label == 'jcef-api') {
            throw new GradleException("JCEF jcef-api: no SHA-256 pin. Add to gradle.properties:\n  ${pinKey}=${actual}")
        }
        logger.warn("JCEF ${label}: no SHA-256 pin yet (${pinKey} is empty). Add after first verification: ${pinKey}=${actual}")
        return
    }
    if (actual != pin.toLowerCase()) {
        throw new GradleException("JCEF ${label}: SHA-256 MISMATCH!\n  pinned:  ${pin}\n  actual:  ${actual}\n  artifact: ${file}")
    }
    logger.lifecycle("JCEF ${label}: SHA-256 OK")
}

tasks.register('verifyJcefChecksums') {
    group = 'verification'
    description = 'Verifies the SHA-256 of the JCEF artifacts (API + platform natives) against the pins in gradle.properties'
    def apiFile = project.provider {
        configurations.compileClasspath.files.find { it.name.startsWith('jcef-api-') && it.name.endsWith('.jar') }
    }
    def nativesFile = project.provider { configurations.jcefNatives.singleFile }
    inputs.files(apiFile, nativesFile)
    doLast {
        verifyJcefArtifact('jcef-api', 'jcef.sha256.api', apiFile.get())
        verifyJcefArtifact("jcef-natives-${jcefKey}", "jcef.sha256.${jcefKey}", nativesFile.get())
    }
}

/**
 * Unpacks the platform natives artifact into jcef/<os>-<arch>/ (the dedicated directory
 * the CEF engine runs from, plan D1/D2).
 *
 * Artifact layout (verified F0, CEF 146.0.10): the natives JAR does not contain the
 * distribution directly — it wraps it as a single embedded *.tar.gz entry (plus
 * META-INF and a me/ marker package). The tar root IS the distribution root:
 * libcef(.dll/.so/.dylib), the CEF subprocess (jcef_helper.exe on Windows), locales/,
 * pak/snapshot files and build_meta.json.
 *
 * Extraction is two-step:
 *   1. pull the embedded tar.gz out of the jar (into build/jcef/),
 *   2. extract it with the system `tar` (bsdtar on Windows/macOS, GNU tar on Linux —
 *      Ant's untar cannot parse this GNU-format archive).
 * Idempotent: re-runs are no-ops while the VERSION file matches the pinned version.
 */
tasks.register('extractJcef') {
    dependsOn verifyJcefChecksums
    def outDir = new File(jcefRoot, jcefKey)
    def versionFile = new File(outDir, 'VERSION')
    def tarFile = layout.buildDirectory.file("jcef/${jcefKey}/dist.tar.gz").get().asFile
    inputs.files(configurations.jcefNatives)
    outputs.dir(outDir)
    doLast {
        if (versionFile.exists() && versionFile.text.trim() == jcefVersion) {
            logger.lifecycle("JCEF ${jcefKey} already extracted (${jcefVersion}) - skipping")
            return
        }
        def jarFile = configurations.jcefNatives.singleFile
        java.util.zip.ZipFile zf = new java.util.zip.ZipFile(jarFile)
        try {
            def entry = zf.entries().find { it.name.endsWith('.tar.gz') }
            if (entry == null) {
                throw new GradleException("JCEF natives jar contains no embedded .tar.gz: ${jarFile}")
            }
            tarFile.parentFile.mkdirs()
            zf.getInputStream(entry).with { input ->
                tarFile.withOutputStream { output -> input.transferTo(output) }
            }
        } finally {
            zf.close()
        }
        logger.lifecycle("JCEF ${jcefKey}: extracted embedded tar.gz (${(tarFile.length() / 1024 / 1024).round(1)} MB)")
        delete outDir
        outDir.mkdirs()
        def process = new ProcessBuilder('tar', '-xzf', tarFile.absolutePath, '-C', outDir.absolutePath)
                .redirectError(ProcessBuilder.Redirect.INHERIT)
                .start()
        def code = process.waitFor()
        if (code != 0) {
            throw new GradleException("System 'tar' failed (exit ${code}) while extracting ${tarFile}. " +
                    'A tar tool is required (bundled with Windows 10+/macOS as bsdtar; GNU tar on Linux).')
        }
        versionFile.text = jcefVersion
        logger.lifecycle("JCEF ${jcefKey}: distribution ready at ${outDir}")
    }
}

// `run` needs the native distribution in place (first run downloads ~150 MB, then offline).
tasks.named('run') {
    dependsOn extractJcef
}

test {
    useJUnitPlatform()
    testLogging {
        exceptionFormat = 'full'
        showStandardStreams = true
        events = ["passed", "skipped", "failed"]
    }

    jvmArgs += [
        "--add-opens=java.base/java.lang=ALL-UNNAMED",
        "--add-opens=java.base/java.util=ALL-UNNAMED",
        "--add-opens=java.base/java.io=ALL-UNNAMED",
        "--add-opens=java.base/java.net=ALL-UNNAMED",
        "--add-opens=java.base/jdk.internal.reflect=ALL-UNNAMED",
        "--add-opens=java.logging/java.util.logging=ALL-UNNAMED"
    ]

    exclude '**/FeeSuggestionCalculatorTest.class',
            '**/AliasServiceImplTest.class',
            '**/it/java/node/**',
            '**/chain/**'
}

/**
 * Exclude-free test runner: lets {@code --tests '<FQCN>'} work against the full test tree.
 * The default {@code test} task excludes several classes (see above), which makes Gradle
 * report "No tests found for given includes … (exclude rules)" when combined with {@code --tests}.
 * Use this task to run a specific test class without those exclusions:
 *
 * <pre>{@code
 * gradlew runTest --tests 'application.module.logging.gui.LoggingPanelTest'
 * }</pre>
 */
tasks.register('runTest', Test) {
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    testLogging {
        exceptionFormat = 'full'
        showStandardStreams = true
        events = ["passed", "skipped", "failed"]
    }
    jvmArgs += [
        "--add-opens=java.base/java.lang=ALL-UNNAMED",
        "--add-opens=java.base/java.util=ALL-UNNAMED",
        "--add-opens=java.base/java.io=ALL-UNNAMED",
        "--add-opens=java.base/java.net=ALL-UNNAMED",
        "--add-opens=java.base/jdk.internal.reflect=ALL-UNNAMED",
        "--add-opens=java.logging/java.util.logging=ALL-UNNAMED"
    ]
}

/**
 * Integration tests requiring a LIVE mock node on localhost:6876 (see chain.ChainUtils.setupNode).
 * Skipped automatically when no node is reachable; run explicitly with: gradlew integrationTest
 */
import java.net.Socket

tasks.register('integrationTest', Test) {
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/chain/**'
    testLogging {
        exceptionFormat = 'full'
        showStandardStreams = true
        events = ["passed", "skipped", "failed"]
    }
    jvmArgs += [
        "--add-opens=java.base/java.lang=ALL-UNNAMED",
        "--add-opens=java.base/java.util=ALL-UNNAMED",
        "--add-opens=java.base/java.io=ALL-UNNAMED",
        "--add-opens=java.base/java.net=ALL-UNNAMED",
        "--add-opens=java.base/jdk.internal.reflect=ALL-UNNAMED",
        "--add-opens=java.logging/java.util.logging=ALL-UNNAMED"
    ]
    onlyIf {
        try {
            new Socket("localhost", 6876).withCloseable { it.isConnected() }
        } catch (Exception e) {
            logger.warn("integrationTest skipped: no mock node reachable on localhost:6876")
            return false
        }
        return true
    }
}

