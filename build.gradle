// === JOOQ Codegen

def schema_dburl = "jdbc:sqlite:${project.projectDir}/temp/generated/db/signum_jooq.sqlite"
def schema_dbusername = ""
def schema_dbpassword = ""

flyway {
    url = "${schema_dburl}"
    user = "${schema_dbusername}"
    password = "${schema_dbpassword}"
    locations = ["filesystem:" + project.projectDir + "/resources/db/node/migration_sqlite"]
}

import nu.studer.gradle.jooq.JooqEdition

jooq {
    version = '3.21.8'
    edition = JooqEdition.OSS

    configurations {
        main {
            generateSchemaSourceOnCompilation = false
            generationTool {
                logging = org.jooq.meta.jaxb.Logging.DEBUG
                jdbc {
                    driver = 'org.sqlite.JDBC'
                    url = "${schema_dburl}"
                }
                generator {
                    name = 'org.jooq.codegen.DefaultGenerator'
                    database {
                        name = 'org.jooq.meta.sqlite.SQLiteDatabase'
                        includes = '.*'
                        // jOOQ 3.21: the SQLite meta database no longer tolerates <inputSchema/>
                        // ("does not support schemata"), and <outputSchema/> must be paired with
                        // <inputSchema/>. Both removed: the scratch-generated node.schema classes
                        // stay flat (defaultCatalog/defaultSchema) and are not compiled against
                        // the checked-in application.module.node.schema classes.
                        forcedTypes {
                            forcedType {
                                name = 'BOOLEAN'
                                // jOOQ 3.21: <expression/>/<types/> renamed to <includeExpression/>/<includeTypes/>
                                includeExpression = '.*\\.(.*\\.LATEST|MINTABLE|AT_STATE\\.FREEZE_WHEN_SAME_BALANCE|GOODS\\.DELISTED|TRANSACTION\\.(HAS_MESSAGE|HAS_ENCRYPTED_MESSAGE|HAS_PUBLIC_KEY_ANNOUNCEMENT|HAS_ENCRYPTTOSELF_MESSAGE)|PURCHASE\\.(PENDING|HAS_FEEDBACK_NOTES|HAS_PUBLIC_FEEDBACKS))'
                                includeTypes = '.*'
                            }
                        }
                    }
                    target {
                        packageName = 'node.schema'
                        directory = 'temp/generated/jooq'
                    }
                }
            }
        }
    }
}

generateJooq.dependsOn(tasks.named('flywayMigrate'))

// The codegen worker runs with the `jooqGenerator` configuration as its classpath;
// the SQLite driver lives in `implementation`, so it must be added explicitly here.
dependencies {
    jooqGenerator 'org.xerial:sqlite-jdbc:3.53.4.0'
}

tasks.register('setupDatabaseDirectories') {
    group = 'setup'
    description = 'Creates the database directory structure'
    doLast {
        def dbBase = file("${projectDir}/database")
        ['MariaDB', 'PostgreSQL', 'SQLite'].each { dir ->
            new File(dbBase, dir).mkdirs()
        }
        // Scratch directory of the codegen DB (temp/generated/db/signum_jooq.sqlite):
        // the SQLite driver fails with SQLITE_CANTOPEN if the parent folder is missing.
        file("${projectDir}/temp/generated/db").mkdirs()
    }
}

processResources.dependsOn setupDatabaseDirectories
// generateJooq does not go through processResources (its chain is flywayMigrate -> generateJooq),
// so flywayMigrate must also wait for the directory setup.
tasks.named('flywayMigrate').configure {
    dependsOn(setupDatabaseDirectories)
}