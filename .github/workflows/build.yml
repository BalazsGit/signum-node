# This workflow will build and test the Signum Node with Gradle
# For more information see: https://docs.gradle.org/current/userguide/build_lifecycle.html

name: Build Signum Node

on:
  pull_request:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
      - name: Build with Gradle and run all tests
        run: ./gradlew test
